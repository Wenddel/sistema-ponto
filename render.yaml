services:
  - type: web
    name: sistema-ponto-clinica
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python sistema_ponto_v3.2_COM_BACKUP.py"
    envVars:
      - key: TZ
        value: America/Sao_Paulo
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PERSIST_DIR
        value: /var/data
    autoDeploy: yes
    # 🛡️ DISCO PERSISTENTE - NÃO É APAGADO NOS DEPLOYS
    disks:
      - name: dados-ponto
        mountPath: /var/data
        sizeGB: 1
