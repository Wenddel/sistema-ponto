services:
  - type: web
    name: sistema-ponto-clinica
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python sistema_ponto.py"
    envVars:
      - key: TZ
        value: America/Sao_Paulo
      - key: PYTHON_VERSION
        value: 3.11.0
    autoDeploy: yes
